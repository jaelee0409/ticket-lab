<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ticket-lab</title>
<style>
  :root {
    --paper: #eef1f2;
    --surface: #ffffff;
    --ink: #161c1f;
    --muted: #64757d;
    --line: #d3dbdf;
    --accent: #1f5e8c;
    --available: #f7f9fa;
    --held: #e7a13c;
    --sold: #9aa7ad;
    --mine: #1f5e8c;
    --danger: #b0442a;
    --ok: #2e6b4f;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #101416; --surface: #171d20; --ink: #e2e7e9; --muted: #8b9aa1;
      --line: #2a3338; --accent: #5aa9dc; --available: #1e2529; --held: #c8862b;
      --sold: #3a464c; --mine: #5aa9dc; --danger: #e08464; --ok: #63b98c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 15px/1.6 "Malgun Gothic", system-ui, sans-serif;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
  header { display: flex; align-items: baseline; gap: .75rem; margin-bottom: 1.5rem; }
  h1 { font-size: 1.3rem; margin: 0; letter-spacing: -.02em; }
  header .sub { color: var(--muted); font-size: .85rem; font-family: var(--mono); }
  .grid { display: grid; grid-template-columns: 1fr 320px; gap: 1.25rem; align-items: start; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 4px; padding: 1.1rem 1.15rem; margin-bottom: 1.25rem;
  }
  .card h2 {
    font-size: .72rem; text-transform: uppercase; letter-spacing: .12em;
    color: var(--muted); margin: 0 0 .9rem; font-family: var(--mono); font-weight: 600;
  }
  label { display: block; font-size: .8rem; color: var(--muted); margin-bottom: .25rem; }
  input, select {
    width: 100%; padding: .5rem .6rem; margin-bottom: .7rem; font: inherit;
    background: var(--paper); color: var(--ink);
    border: 1px solid var(--line); border-radius: 3px;
  }
  button {
    font: inherit; padding: .5rem .9rem; border-radius: 3px; cursor: pointer;
    border: 1px solid var(--accent); background: var(--accent); color: #fff;
  }
  button.ghost { background: transparent; color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .row { display: flex; gap: .5rem; flex-wrap: wrap; }
  .seats { display: grid; grid-template-columns: repeat(auto-fill, minmax(74px, 1fr)); gap: .5rem; }
  .seat {
    border: 1px solid var(--line); border-radius: 3px; padding: .5rem .3rem;
    text-align: center; background: var(--available); color: var(--ink);
    font-family: var(--mono); font-size: .8rem; line-height: 1.35; cursor: pointer;
  }
  .seat small { display: block; font-size: .64rem; color: var(--muted); }
  .seat.HELD { background: var(--held); border-color: var(--held); color: #1a1206; cursor: not-allowed; }
  .seat.HELD small { color: #4a3a18; }
  .seat.SOLD { background: var(--sold); border-color: var(--sold); color: #fff; cursor: not-allowed; }
  .seat.SOLD small { color: #eef1f2; }
  .seat.mine { outline: 2px solid var(--mine); outline-offset: 1px; }
  .legend { display: flex; gap: 1rem; font-size: .75rem; color: var(--muted); margin-top: .9rem; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: .3rem; vertical-align: -1px; border: 1px solid var(--line); }
  .status { font-family: var(--mono); font-size: .8rem; }
  .status.err { color: var(--danger); }
  .status.ok { color: var(--ok); }
  .log { font-family: var(--mono); font-size: .72rem; max-height: 300px; overflow-y: auto; }
  .log div { padding: .3rem 0; border-bottom: 1px solid var(--line); display: flex; gap: .5rem; }
  .log .code { flex: none; width: 2.2rem; }
  .log .c2 { color: var(--ok); } .log .c4, .log .c5 { color: var(--danger); }
  .log .rid { color: var(--muted); flex: none; }
  .kv { display: grid; grid-template-columns: 6rem 1fr; gap: .2rem .6rem; font-size: .82rem; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; font-family: var(--mono); }
  .big { font-family: var(--mono); font-size: 1.5rem; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>ticket-lab</h1>
    <span class="sub" id="conn">연결 확인 중…</span>
  </header>

  <div class="grid">
    <div>
      <div class="card">
        <h2>좌석</h2>
        <label for="eventSel">공연</label>
        <select id="eventSel"></select>
        <div class="seats" id="seats"></div>
        <div class="legend">
          <span><i style="background:var(--available)"></i>판매 중</span>
          <span><i style="background:var(--held)"></i>선점됨</span>
          <span><i style="background:var(--sold)"></i>판매 완료</span>
          <span><i style="background:transparent;outline:2px solid var(--mine)"></i>내 예약</span>
          <span id="tick" style="margin-left:auto"></span>
        </div>
      </div>
    </div>

    <div>
      <div class="card" id="authCard">
        <h2>계정</h2>
        <div id="loggedOut">
          <label for="email">이메일</label>
          <input id="email" type="email" value="buyer@test.com" autocomplete="username">
          <label for="pw">비밀번호</label>
          <input id="pw" type="password" value="password123" autocomplete="current-password">
          <div class="row">
            <button id="loginBtn">로그인</button>
            <button id="signupBtn" class="ghost">회원가입</button>
          </div>
        </div>
        <div id="loggedIn" hidden>
          <dl class="kv">
            <dt>이메일</dt><dd id="whoEmail"></dd>
            <dt>사용자</dt><dd id="whoId"></dd>
          </dl>
          <div class="row" style="margin-top:.8rem">
            <button id="logoutBtn" class="ghost">로그아웃</button>
          </div>
        </div>
        <p class="status" id="authMsg"></p>
      </div>

      <div class="card">
        <h2>내 선점</h2>
        <div id="noRes" class="status">좌석을 눌러 선점하세요.</div>
        <div id="hasRes" hidden>
          <dl class="kv">
            <dt>좌석</dt><dd id="rSeat"></dd>
            <dt>예약</dt><dd id="rId"></dd>
            <dt>상태</dt><dd id="rStatus"></dd>
          </dl>
          <p class="big" id="countdown"></p>
          <div class="row">
            <button id="confirmBtn">결제 확정</button>
          </div>
        </div>
        <p class="status" id="resMsg"></p>
      </div>

      <div class="card">
        <h2>요청 기록</h2>
        <div class="log" id="log"></div>
      </div>
    </div>
  </div>
</div>

<script>
const state = { token: null, user: null, eventId: null, reservation: null, seats: [] };
const $ = (id) => document.getElementById(id);

function logLine(status, method, path, requestId) {
  const row = document.createElement("div");
  row.innerHTML =
    `<span class="code c${String(status)[0]}">${status}</span>` +
    `<span class="rid">${requestId || "--------"}</span>` +
    `<span>${method} ${path}</span>`;
  $("log").prepend(row);
  while ($("log").children.length > 40) $("log").lastChild.remove();
}

async function api(method, path, body) {
  const headers = {};
  if (body) headers["Content-Type"] = "application/json";
  if (state.token) headers["Authorization"] = "Bearer " + state.token;

  const res = await fetch(path, { method, headers, body: body ? JSON.stringify(body) : undefined });
  const requestId = res.headers.get("X-Request-Id");
  logLine(res.status, method, path, requestId);

  const text = await res.text();
  const data = text ? JSON.parse(text) : null;
  if (!res.ok) throw Object.assign(new Error(data?.message || res.statusText), { data, status: res.status });
  return data;
}

function setMsg(el, text, kind) {
  const node = $(el);
  node.textContent = text || "";
  node.className = "status" + (kind ? " " + kind : "");
}

// ---------- auth ----------

async function signup() {
  try {
    await api("POST", "/api/auth/signup", { email: $("email").value, password: $("pw").value });
    setMsg("authMsg", "가입 완료. 로그인하세요.", "ok");
  } catch (e) { setMsg("authMsg", e.message, "err"); }
}

async function login() {
  try {
    const t = await api("POST", "/api/auth/login", { email: $("email").value, password: $("pw").value });
    state.token = t.accessToken;
    state.user = await api("GET", "/api/auth/me");
    $("whoEmail").textContent = state.user.email;
    $("whoId").textContent = "#" + state.user.id;
    $("loggedOut").hidden = true;
    $("loggedIn").hidden = false;
    setMsg("authMsg", "");
  } catch (e) { setMsg("authMsg", e.message, "err"); }
}

function logout() {
  state.token = null; state.user = null; state.reservation = null;
  $("loggedOut").hidden = false;
  $("loggedIn").hidden = true;
  renderReservation();
  renderSeats();
}

// ---------- events & seats ----------

async function loadEvents() {
  const events = await api("GET", "/api/events");
  $("eventSel").innerHTML = events
    .map((e) => `<option value="${e.id}">${e.title} — ${e.venue}</option>`).join("");
  if (events.length) { state.eventId = events[0].id; await loadSeats(); }
  $("conn").textContent = "연결됨 · 공연 " + events.length + "건";
}

async function loadSeats() {
  if (!state.eventId) return;
  state.seats = await api("GET", `/api/events/${state.eventId}/seats`);
  renderSeats();
}

function renderSeats() {
  const mine = state.reservation?.seatId;
  $("seats").innerHTML = state.seats.map((s) => `
    <button class="seat ${s.status}${s.id === mine ? " mine" : ""}"
            data-id="${s.id}" ${s.status === "AVAILABLE" ? "" : "disabled"}>
      ${s.seatNo}
      <small>${(s.price / 10000).toFixed(0)}만원</small>
    </button>`).join("");
}

async function hold(seatId) {
  if (!state.token) { setMsg("resMsg", "먼저 로그인하세요.", "err"); return; }
  try {
    state.reservation = await api("POST", "/api/reservations", { seatId });
    setMsg("resMsg", "");
    renderReservation();
    await loadSeats();
  } catch (e) { setMsg("resMsg", e.data?.code + " · " + e.message, "err"); }
}

async function confirmReservation() {
  try {
    state.reservation = await api("POST", `/api/reservations/${state.reservation.id}/confirm`);
    setMsg("resMsg", "확정되었습니다.", "ok");
    renderReservation();
    await loadSeats();
  } catch (e) { setMsg("resMsg", e.data?.code + " · " + e.message, "err"); }
}

function renderReservation() {
  const r = state.reservation;
  $("noRes").hidden = !!r;
  $("hasRes").hidden = !r;
  if (!r) return;
  $("rSeat").textContent = r.seatNo;
  $("rId").textContent = "#" + r.id;
  $("rStatus").textContent = r.status;
  $("confirmBtn").disabled = r.status !== "PENDING";
}

function tickCountdown() {
  const r = state.reservation;
  if (!r || !r.expiresAt) { $("countdown").textContent = r ? "—" : ""; return; }
  const left = Math.round((new Date(r.expiresAt) - Date.now()) / 1000);
  $("countdown").textContent = left > 0 ? left + "초 남음" : "만료됨";
  $("countdown").style.color = left > 10 ? "" : "var(--danger)";
}

// ---------- wiring ----------

$("loginBtn").onclick = login;
$("signupBtn").onclick = signup;
$("logoutBtn").onclick = logout;
$("confirmBtn").onclick = confirmReservation;
$("eventSel").onchange = (e) => { state.eventId = Number(e.target.value); loadSeats(); };
$("seats").onclick = (e) => {
  const btn = e.target.closest(".seat");
  if (btn && !btn.disabled) hold(Number(btn.dataset.id));
};

let ticks = 0;
setInterval(() => {
  tickCountdown();
  if (++ticks % 3 === 0) loadSeats().catch(() => {});
  $("tick").textContent = "자동 새로고침 " + (3 - (ticks % 3)) + "초";
}, 1000);

loadEvents().catch((e) => { $("conn").textContent = "연결 실패: " + e.message; });
</script>
</body>
</html>
