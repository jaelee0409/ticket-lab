spring:
  application:
    name: ticket-lab

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ticketlab}
    username: ${DB_USER:ticketlab}
    password: ${DB_PASSWORD:ticketlab}
    hikari:
      pool-name: ticket-lab-pool
      # Experiment knob (goal 3): sweep this to find where a bigger pool
      # stops helping and starts hurting.
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    hibernate:
      # Schema is owned by Flyway migrations, never by Hibernate.
      ddl-auto: none
    # Must stay false: with OSIV on, a DB connection is held for the entire
    # request including view rendering, which silently caps throughput and
    # would invalidate the connection-pool experiment.
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8080}

logging:
  pattern:
    level: "%5p [%X{requestId:-------}]"

ticketlab:
  auth:
    jwt-secret: ${JWT_SECRET:ticket-lab-local-development-secret-key-do-not-ship}
    access-token-ttl: ${ACCESS_TOKEN_TTL:15m}
  reservation:
    # How long a held seat stays reserved before the sweeper releases it.
    # Experiment knob: this is one axis of the queue experiment later.
    hold-duration: ${HOLD_DURATION:5m}
    sweep-interval-ms: ${SWEEP_INTERVAL_MS:10000}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  metrics:
    tags:
      # Every series gets this label, so one Prometheus can hold several runs.
      application: ticket-lab
    distribution:
      # Publishes the bucket series Prometheus needs to compute percentiles.
      # Without this, only count/sum/max exist and p95 cannot be derived.
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 5ms,10ms,25ms,50ms,100ms,250ms,500ms,1s,2s
  endpoint:
    health:
      # Local development only - reveals infrastructure internals.
      show-details: always
      show-components: always
